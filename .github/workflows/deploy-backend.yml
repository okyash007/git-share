name: Build and deploy Lambda

on:
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '803101751134'
  ECR_REPOSITORY: git-share-backend
  LAMBDA_FUNCTION: git-share-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/models/Share.js
      - uses: docker/setup-buildx-action@v3
      - name: Validate container build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: lambda-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check AWS secrets
        env:
          ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$ACCESS_KEY_ID" ] || [ -z "$SECRET_ACCESS_KEY" ]; then
            echo '::error::Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as repository secrets.'
            exit 1
          fi
      - name: Authenticate to AWS with access keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo '::error::Authenticated to an unexpected AWS account.'
            exit 1
          fi
      - name: Log in to ECR
        env:
          REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy exact image digest and wait for completion
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$IMAGE_URI" \
            --query '{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus}'
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"
          DEPLOYED_IMAGE=$(aws lambda get-function --function-name "$LAMBDA_FUNCTION" --query 'Code.ResolvedImageUri' --output text)
          if [ "$DEPLOYED_IMAGE" != "$IMAGE_URI" ]; then
            echo '::error::Lambda image does not match the image built by this run.'
            exit 1
          fi
          echo "Deployed ${IMAGE_URI}" >> "$GITHUB_STEP_SUMMARY"
